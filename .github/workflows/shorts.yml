name: Shorts de notícias
run-name: ${{ github.event_name == 'schedule' && 'Vigia da publicação automática' || (inputs.apenas_esperar && 'Short automático (à espera da manhã)') || (inputs.cadeia && 'Short automático') || 'Shorts de notícias (manual)' }}

# Publicação automática: cada vídeo "Short automático", ao terminar, espera pelo próximo
# horário (secção "agenda" do config.yaml) e lança o seguinte. Não depende dos horários
# do GitHub, que nesta conta não estão a disparar.
# Para PARAR: em Actions, cancela a execução "Short automático" que estiver a correr.
# Para LIGAR de novo: "Run workflow" com "Ligar a publicação automática" marcado.

on:
  schedule:
    # Vigia: se a cadeia automática parar, volta a ligá-la (só funciona quando o GitHub disparar horários).
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no YouTube? (deixa desmarcado para só criar um vídeo de teste)"
        type: boolean
        default: false
      modo_publicacao:
        description: "Como publicar (se marcado acima): config = o que está no config.yaml"
        type: choice
        options: [config, privado, agendado, publico]
        default: config
      exigir_excerto:
        description: "Só criar o vídeo se encontrar um trecho real de entrevista/discurso"
        type: boolean
        default: false
      trecho_demo:
        description: "(Teste) Vídeo de demonstração com o trecho de um vídeo do Wikimedia Commons, ex.: File:Nome.webm"
        type: string
        default: ""
      cadeia:
        description: "Ligar a publicação automática (um vídeo a cada 30 min, conforme o config.yaml)"
        type: boolean
        default: false
      apenas_esperar:
        description: "(Interno) Só esperar pelo próximo horário, sem criar vídeo"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  short:
    if: github.event_name == 'workflow_dispatch' && !inputs.apenas_esperar
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: shorts-noticias
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Modelo de transcrição (cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-modelos-v1

      - name: Criar (e publicar) o Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODO_YT: ${{ inputs.modo_publicacao || 'config' }}
          EXIGIR_EXCERTO: ${{ inputs.exigir_excerto && 'true' || '' }}
          DEMO_TRECHO: ${{ inputs.trecho_demo || '' }}
        run: |
          if [ "${{ inputs.publicar }}" != "true" ]; then
            python shorts.py --sem-upload
          else
            python shorts.py
          fi

      - name: Guardar o vídeo (para veres/descarregares)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-${{ github.run_number }}
          path: |
            saida/*.mp4
            saida/ultimo.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Atualizar histórico (para não repetir notícias)
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          if [ ! -f data/historico.json ]; then
            echo "Sem histórico novo (modo de teste)."
            exit 0
          fi
          git add data/historico.json
          if ! git diff --cached --quiet; then
            git commit -m "Histórico: novo Short publicado"
            git pull --rebase --quiet || true
            git push
          fi

  proximo:
    needs: short
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cadeia }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Esperar pelo próximo horário e lançar o vídeo seguinte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(python3 agenda.py)
          LIMITE=18000   # um trabalho do GitHub dura no máximo 6 h: esperas maiores passam a outra execução
          if [ "$S" -gt "$LIMITE" ]; then
            echo "Próximo vídeo daqui a $((S / 60)) min: espero $((LIMITE / 60)) min e passo a vez."
            sleep "$LIMITE"
            EXTRA="-f apenas_esperar=true"
          else
            echo "Próximo vídeo daqui a $((S / 60)) min."
            sleep "$S"
            EXTRA=""
          fi
          # se entretanto foi ligada outra cadeia mais recente, esta termina (evita vídeos a dobrar)
          OUTRAS=$(gh run list --workflow shorts.yml --limit 30 --json databaseId,status,displayTitle \
            --jq "[.[] | select(.displayTitle | test(\"automático\")) | select(.status != \"completed\") | select(.databaseId > ${{ github.run_id }})] | length")
          if [ "$OUTRAS" != "0" ]; then
            echo "Já há outra execução automática mais recente; esta termina aqui."
            exit 0
          fi
          gh workflow run shorts.yml --ref "${{ github.ref_name }}" -f publicar=true -f cadeia=true $EXTRA
          echo "Lançado o próximo Short automático."

  vigia:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Voltar a ligar a publicação automática se tiver parado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ATIVAS=$(gh run list -R "${{ github.repository }}" --workflow shorts.yml --limit 40 --json status,displayTitle,createdAt \
            --jq '[.[] | select(.displayTitle | test("automático")) | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 3600)] | length')
          if [ "$ATIVAS" = "0" ]; then
            echo "A publicação automática estava parada: a ligar de novo."
            gh workflow run shorts.yml -R "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}" -f publicar=true -f cadeia=true
          else
            echo "A publicação automática está a funcionar."
          fi
