name: Shorts de notícias

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). Com "agendado" + 1h de revisão, os vídeos
    # ficam públicos por volta das 08h, 11h30, 14h30, 18h e 21h de Brasília.
    - cron: "7 10 * * *"    # 07:07 Brasília
    - cron: "37 13 * * *"   # 10:37 Brasília
    - cron: "37 16 * * *"   # 13:37 Brasília
    - cron: "7 20 * * *"    # 17:07 Brasília
    - cron: "7 23 * * *"    # 20:07 Brasília
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no YouTube? (deixa desmarcado para só criar um vídeo de teste)"
        type: boolean
        default: false
      modo_publicacao:
        description: "Como publicar (se marcado acima): config = o que está no config.yaml"
        type: choice
        options: [config, privado, agendado, publico]
        default: config
      exigir_excerto:
        description: "Só criar o vídeo se encontrar um trecho real de entrevista/discurso"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts-noticias
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Modelo de transcrição (cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-modelos-v1

      - name: Criar (e publicar) o Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODO_YT: ${{ inputs.modo_publicacao || 'config' }}
          EXIGIR_EXCERTO: ${{ inputs.exigir_excerto && 'true' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" != "true" ]; then
            python shorts.py --sem-upload
          else
            python shorts.py
          fi

      - name: Guardar o vídeo (para veres/descarregares)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-${{ github.run_number }}
          path: |
            saida/*.mp4
            saida/ultimo.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Atualizar histórico (para não repetir notícias)
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          if [ ! -f data/historico.json ]; then
            echo "Sem histórico novo (modo de teste)."
            exit 0
          fi
          git add data/historico.json
          if ! git diff --cached --quiet; then
            git commit -m "Histórico: novo Short publicado"
            git pull --rebase --quiet || true
            git push
          fi
