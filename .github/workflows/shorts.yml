name: Shorts de notícias

on:
  schedule:
    # 25 vídeos por dia, um a cada 45 minutos, criados entre as 05:07 e as 23:07 de Brasília.
    # Horários em UTC (Brasília = UTC-3). Com "agendado" + 1h de revisão, ficam públicos
    # entre as 06:07 e as 00:07 de Brasília. (O GitHub pode atrasar alguns minutos.)
    - cron: "7 2,8,11,14,17,20,23 * * *"    # Brasília: 05:07 08:07 11:07 14:07 17:07 20:07 23:07
    - cron: "52 8,11,14,17,20,23 * * *"     # Brasília: 05:52 08:52 11:52 14:52 17:52 20:52
    - cron: "37 0,9,12,15,18,21 * * *"      # Brasília: 06:37 09:37 12:37 15:37 18:37 21:37
    - cron: "22 1,10,13,16,19,22 * * *"     # Brasília: 07:22 10:22 13:22 16:22 19:22 22:22
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no YouTube? (deixa desmarcado para só criar um vídeo de teste)"
        type: boolean
        default: false
      modo_publicacao:
        description: "Como publicar (se marcado acima): config = o que está no config.yaml"
        type: choice
        options: [config, privado, agendado, publico]
        default: config
      exigir_excerto:
        description: "Só criar o vídeo se encontrar um trecho real de entrevista/discurso"
        type: boolean
        default: false
      trecho_demo:
        description: "(Teste) Vídeo de demonstração com o trecho de um vídeo do Wikimedia Commons, ex.: File:Nome.webm"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: shorts-noticias
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Modelo de transcrição (cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-modelos-v1

      - name: Criar (e publicar) o Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODO_YT: ${{ inputs.modo_publicacao || 'config' }}
          EXIGIR_EXCERTO: ${{ inputs.exigir_excerto && 'true' || '' }}
          DEMO_TRECHO: ${{ inputs.trecho_demo || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" != "true" ]; then
            python shorts.py --sem-upload
          else
            python shorts.py
          fi

      - name: Guardar o vídeo (para veres/descarregares)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-${{ github.run_number }}
          path: |
            saida/*.mp4
            saida/ultimo.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Atualizar histórico (para não repetir notícias)
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          if [ ! -f data/historico.json ]; then
            echo "Sem histórico novo (modo de teste)."
            exit 0
          fi
          git add data/historico.json
          if ! git diff --cached --quiet; then
            git commit -m "Histórico: novo Short publicado"
            git pull --rebase --quiet || true
            git push
          fi
